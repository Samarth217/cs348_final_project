<!-- song_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Song List</title>
</head>
<body>
    <h1>Song List</h1>
    <a href="{% url 'add_song' %}">Add New Song</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Duration</th>
            <th>Artist</th>
            <th>Genre</th>
            <th>Album</th>
            <th>Actions</th>
        </tr>
        {% for song in songs %}
        <tr>
            <td>{{ song.0 }}</td>
            <td>{{ song.1 }}</td>
            <td>{{ song.2 }}</td>
            <td>{{ song.3 }}</td>
            <td>{{ song.4 }}</td>
            <td>{{ song.5 }}</td>
            <td>
                <a href="{% url 'edit_song' song.0 %}">Edit</a> |
                <a href="{% url 'delete_song' song.0 %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
