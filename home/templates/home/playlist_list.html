{% extends "base.html" %}
{% block content %}
<h2>Playlists</h2>
<table>
    <tr><th>ID</th><th>Title</th><th>User</th><th>Actions</th></tr>
    {% for p in playlists %}
        <tr>
            <td>{{ p.playlist_id }}</td>
            <td>{{ p.title }}</td>
            <td>{{ p.user.username }}</td>
            <td>
                <a href="{% url 'playlist_detail' p.playlist_id %}">View Details</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4">No playlists yet.</td></tr>
    {% endfor %}
</table>
<p><a href="{% url 'create_playlist' %}">Create New Playlist</a></p>
{% endblock %}
